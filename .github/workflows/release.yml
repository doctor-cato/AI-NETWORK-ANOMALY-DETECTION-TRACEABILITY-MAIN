name: Release Windows Desktop

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag_label:
        description: 'Dry-run version label for artifact naming (when triggered manually without a tag)'
        required: false
        default: 'v0.6.0-dryrun'
      companion_bundle_dir:
        description: 'Optional external directory containing staged companion artifacts (artifacts/, data/demo/, COMPANION_SHA256SUMS.txt)'
        required: false
        default: ''

permissions:
  contents: read

jobs:
  release-windows-x64:
    name: Build, Verify & Package Windows x64 Release
    runs-on: windows-latest
    env:
      CARGO_INCREMENTAL: "0"
      CARGO_PROFILE_DEV_DEBUG: "0"
      CARGO_PROFILE_TEST_DEBUG: "0"
      CARGO_TERM_COLOR: "always"
    permissions:
      contents: write
    steps:
      - name: Checkout repository at exact ref
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Verify clean working tree, tag integrity, and version consistency
        id: meta
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $dirty = git status --porcelain
          if ($dirty) {
            Write-Error "Working tree is not clean:`n$dirty"
            exit 1
          }
          git diff --check
          if ($LASTEXITCODE -ne 0) {
            Write-Error "git diff --check failed."
            exit 1
          }

          $desktopVer = (python -c "from scripts.check_desktop_version import collect_desktop_versions; print(next(iter(collect_desktop_versions().values())))").Trim()
          if ([string]::IsNullOrWhiteSpace($desktopVer)) {
            Write-Error "Failed to read configured desktop version."
            exit 1
          }

          $isTagPush = "${{ github.ref }}".StartsWith("refs/tags/v")
          if ($isTagPush) {
            $tagName = "${{ github.ref_name }}"
            if ($tagName -notmatch '^v(0|[1-9]\d*)\.(0|[1-9]\d*)\.(0|[1-9]\d*)(-[0-9A-Za-z-]+(\.[0-9A-Za-z-]+)*)?$') {
              Write-Error "Invalid SemVer release tag format: $tagName"
              exit 1
            }

            $tagCommit = (git rev-list -n 1 "refs/tags/$tagName").Trim()
            if ($tagCommit -ne "${{ github.sha }}") {
              Write-Error "Tag $tagName commit ($tagCommit) does not match GITHUB_SHA (${{ github.sha }})."
              exit 1
            }

            $isPrerelease = $tagName.Contains("-")
            # Enforce origin/main ancestry for BOTH beta pre-releases and stable releases.
            git fetch origin main
            if ($LASTEXITCODE -ne 0) {
              Write-Error "Failed to fetch origin/main for ancestry verification."
              exit 1
            }
            git merge-base --is-ancestor $tagCommit origin/main
            if ($LASTEXITCODE -ne 0) {
              Write-Error "Refusing to publish release for $tagName because commit $tagCommit is not merged into origin/main."
              exit 1
            }

            gh release view $tagName > $null 2>&1
            if ($LASTEXITCODE -eq 0) {
              Write-Error "GitHub Release for tag $tagName already exists. Refusing to overwrite or move a published release tag."
              exit 1
            }

            # Require strict 1-to-1 SemVer match between Git tag (vX.Y.Z[-beta.N]) and desktop configs/binary.
            python scripts/check_desktop_version.py --check --expect-tag $tagName
            if ($LASTEXITCODE -ne 0) { exit 1 }
          } else {
            python scripts/check_desktop_version.py --check
            if ($LASTEXITCODE -ne 0) { exit 1 }
            $tagName = "${{ inputs.tag_label }}"
            if ([string]::IsNullOrWhiteSpace($tagName)) { $tagName = "v$desktopVer-dryrun" }
            if (-not $tagName.StartsWith("v$desktopVer-")) {
              Write-Error "Dry-run tag_label '$tagName' must start with 'v$desktopVer-' to match desktop version '$desktopVer'."
              exit 1
            }
            $isPrerelease = $true
          }

          "tag_name=$tagName" | Out-File -FilePath $env:GITHUB_OUTPUT -Append -Encoding utf8
          "desktop_version=$desktopVer" | Out-File -FilePath $env:GITHUB_OUTPUT -Append -Encoding utf8
          "is_tag_push=$($isTagPush.ToString().ToLower())" | Out-File -FilePath $env:GITHUB_OUTPUT -Append -Encoding utf8
          "is_prerelease=$($isPrerelease.ToString().ToLower())" | Out-File -FilePath $env:GITHUB_OUTPUT -Append -Encoding utf8

      - name: Stage and verify external companion bundle (workflow_dispatch optional)
        if: github.event_name == 'workflow_dispatch' && inputs.companion_bundle_dir != ''
        env:
          COMPANION_BUNDLE_DIR: ${{ inputs.companion_bundle_dir }}
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          python -c @'
          import hashlib, os, re, shutil
          from pathlib import Path

          repo_root = Path.cwd().resolve()
          bundle_dir = Path(os.environ["COMPANION_BUNDLE_DIR"]).resolve()
          if not bundle_dir.is_dir():
              raise SystemExit(f"companion_bundle_dir is not a directory: {bundle_dir}")

          allowed_prefixes = ("artifacts/", "data/demo/", "reports/")
          sums_file = bundle_dir / "COMPANION_SHA256SUMS.txt"

          def safe_copy(rel_posix: str, expected_sha: str | None = None) -> None:
              if not rel_posix or rel_posix.startswith("/") or ".." in Path(rel_posix).parts:
                  raise SystemExit(f"Unsafe companion path rejected: {rel_posix!r}")
              if not any(rel_posix.startswith(p) for p in allowed_prefixes):
                  raise SystemExit(f"Disallowed companion destination prefix: {rel_posix!r}")
              raw_src = bundle_dir / rel_posix
              if raw_src.is_symlink():
                  raise SystemExit(f"Symlink companion source rejected: {raw_src}")
              src = raw_src.resolve()
              if not src.is_relative_to(bundle_dir) or not src.is_file():
                  raise SystemExit(f"Invalid companion source file: {src}")
              actual = hashlib.sha256(src.read_bytes()).hexdigest().lower()
              if expected_sha is not None and actual != expected_sha.lower():
                  raise SystemExit(f"Checksum mismatch for {rel_posix}: {actual} != {expected_sha}")
              dst = (repo_root / rel_posix).resolve()
              if not dst.is_relative_to(repo_root):
                  raise SystemExit(f"Destination escapes repository root: {dst}")
              if rel_posix.startswith(("reports/", "data/demo/")) and dst.is_file():
                  tracked_sha = hashlib.sha256(dst.read_bytes()).hexdigest().lower()
                  if actual != tracked_sha:
                      raise SystemExit(
                          f"Companion bundle {rel_posix} does not match tracked file at HEAD ({actual} != {tracked_sha})"
                      )
                  return
              dst.parent.mkdir(parents=True, exist_ok=True)
              shutil.copy2(src, dst)

          if sums_file.is_file():
              lines = [ln.strip() for ln in sums_file.read_text(encoding="utf-8").splitlines() if ln.strip()]
              if not lines:
                  raise SystemExit("COMPANION_SHA256SUMS.txt is empty")
              for ln in lines:
                  m = re.fullmatch(r"([0-9a-fA-F]{64})\s+\*?(.+)", ln)
                  if not m:
                      raise SystemExit(f"Malformed line in COMPANION_SHA256SUMS.txt: {ln!r}")
                  safe_copy(m.group(2).strip().replace("\\", "/"), m.group(1))
          else:
              for sub in ("artifacts", "data/demo"):
                  sub_dir = bundle_dir / sub
                  if sub_dir.is_dir():
                      for p in sub_dir.rglob("*"):
                          if p.is_file():
                              safe_copy(p.relative_to(bundle_dir).as_posix())
          '@
          if ($LASTEXITCODE -ne 0) { exit 1 }
          python scripts/verify_companion_artifacts.py
          if ($LASTEXITCODE -ne 0) { exit 1 }

      - name: Set up Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: desktop/package-lock.json

      - name: Set up Rust stable toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Cache Rust and Tauri build artifacts
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: "desktop/src-tauri -> target"
          cache-all-crates: true
          cache-on-failure: true

      - name: Run Python verification checks (Environment, Lint, OpenAPI, Pytest, Committed Attestation)
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          python scripts/check_environment.py
          if ($LASTEXITCODE -ne 0) { exit 1 }
          python -m ruff check src scripts tests
          if ($LASTEXITCODE -ne 0) { exit 1 }
          python -m black --check src scripts tests
          if ($LASTEXITCODE -ne 0) { exit 1 }
          python scripts/export_openapi_spec.py --check
          if ($LASTEXITCODE -ne 0) { exit 1 }
          python -m pytest tests/unit tests/contract tests/integration -q
          if ($LASTEXITCODE -ne 0) { exit 1 }

          $desktopVer = "${{ steps.meta.outputs.desktop_version }}"
          $baseSemVer = ($desktopVer -split '-')[0]
          $attestation = "reports/releases/v${baseSemVer}_e2e_verification.json"
          if (-not (Test-Path $attestation)) {
            Write-Error "Missing committed baseline attestation $attestation for pre-build consistency check."
            exit 1
          }
          python scripts/verify_companion_artifacts.py --verify-attestation $attestation
          if ($LASTEXITCODE -ne 0) { exit 1 }

      - name: Install and verify Svelte 5 frontend
        run: |
          npm --prefix desktop ci
          npm --prefix desktop run check
          npm --prefix desktop test
          npm --prefix desktop run build

      - name: Verify Rust formatting, Clippy lints, and unit tests
        env:
          NETWORK_ANOMALY_REQUIRE_PYTHON_TEST: "1"
        run: |
          cargo fmt --manifest-path desktop/src-tauri/Cargo.toml --check
          cargo clippy --release --manifest-path desktop/src-tauri/Cargo.toml --all-targets -- -D warnings
          cargo test --release --manifest-path desktop/src-tauri/Cargo.toml --lib

      - name: Build Tauri Windows x64 application and NSIS installer
        run: |
          npx --prefix desktop tauri build --bundles nsis

      - name: Verify build artifacts, generate SHA256SUMS.txt, and enforce NSIS + Live 4-Model E2E Gate
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $tagName = "${{ steps.meta.outputs.tag_name }}"
          $isPrerelease = "${{ steps.meta.outputs.is_prerelease }}" -eq "true"
          $exePath = "desktop/src-tauri/target/release/netflow-sentinel-desktop.exe"
          if (-not (Test-Path $exePath)) {
            Write-Error "Missing compiled Windows executable: $exePath"
            exit 1
          }

          $desktopVer = "${{ steps.meta.outputs.desktop_version }}"
          $nsisFiles = @(Get-ChildItem -Path "desktop/src-tauri/target/release/bundle/nsis" -Filter "*_${desktopVer}_x64-setup.exe")
          if ($nsisFiles.Count -eq 0) {
            Write-Error "Missing NSIS installer matching '*_${desktopVer}_x64-setup.exe' in desktop/src-tauri/target/release/bundle/nsis"
            exit 1
          }

          $stageDir = "dist/release-assets"
          New-Item -ItemType Directory -Force -Path $stageDir | Out-Null

          $setupAssetName = "NetFlow-Sentinel-$tagName-windows-x64-setup.exe"
          $setupDest = Join-Path $stageDir $setupAssetName
          Copy-Item -Path $nsisFiles[0].FullName -Destination $setupDest -Force

          $setupHash = (python -c "import hashlib, sys; print(hashlib.sha256(open(sys.argv[1], 'rb').read()).hexdigest())" $setupDest).Trim().ToLower()
          $sumsFile = Join-Path $stageDir "SHA256SUMS.txt"
          "$setupHash  $setupAssetName" | Out-File -FilePath $sumsFile -Encoding ascii

          $nsisReport = Join-Path $stageDir "nsis_e2e_verification.json"
          python scripts/verify_companion_artifacts.py --verify-nsis-only `
            --installer-path $setupDest `
            --sums-file $sumsFile `
            --compiled-exe $exePath `
            --output-json $nsisReport
          if ($LASTEXITCODE -ne 0) {
            Write-Error "Clean Windows NSIS E2E verification failed."
            exit 1
          }

          python scripts/verify_companion_artifacts.py > $null
          if ($LASTEXITCODE -eq 0) {
            $releaseAttestation = Join-Path $stageDir "release_e2e_verification.json"
            python scripts/verify_companion_artifacts.py --verify-e2e `
              --installer-path $setupDest `
              --sums-file $sumsFile `
              --compiled-exe $exePath `
              --output-json $releaseAttestation
            if ($LASTEXITCODE -ne 0) {
              Write-Error "Live 4-model + NSIS E2E verification failed."
              exit 1
            }

            python scripts/verify_companion_artifacts.py --verify-attestation $releaseAttestation `
              --expect-commit "${{ github.sha }}" `
              --expect-installer-sha256 $setupHash `
              --require-nsis-e2e
            if ($LASTEXITCODE -ne 0) {
              Write-Error "Generated release E2E attestation failed strict verification."
              exit 1
            }
          } else {
            if (-not $isPrerelease) {
              Write-Error (
                "FAIL-CLOSED: Refusing Stable release ($tagName) because live 4-model companion artifacts " +
                "are NOT READY on this runner. Historical attestation JSON in reports/releases/ MUST NOT " +
                "substitute for live 4-model + clean Windows NSIS E2E verification bound to commit " +
                "${{ github.sha }} and installer SHA-256 $setupHash."
              )
              exit 1
            }
            Write-Warning (
              "Prerelease/dry-run build ($tagName): clean Windows NSIS install/uninstall E2E PASSED " +
              "(recorded in nsis_e2e_verification.json), but live 4-model companion binaries are absent on this runner."
            )
          }

          Write-Host "Staged release assets in ${stageDir}:"
          Get-ChildItem $stageDir | Format-Table Name, Length
          Write-Host "SHA256SUMS.txt contents:"
          Get-Content $sumsFile

      - name: Upload staged Windows release assets to Actions run
        uses: actions/upload-artifact@v4
        with:
          name: netflow-sentinel-${{ steps.meta.outputs.tag_name }}-windows-x64
          path: dist/release-assets/*
          if-no-files-found: error

      - name: Publish GitHub Release (on tag push only)
        if: steps.meta.outputs.is_tag_push == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $tagName = "${{ steps.meta.outputs.tag_name }}"
          $isPrerelease = "${{ steps.meta.outputs.is_prerelease }}" -eq "true"

          gh release view $tagName > $null 2>&1
          if ($LASTEXITCODE -eq 0) {
            Write-Error "GitHub Release for tag $tagName already exists. Refusing to overwrite existing release."
            exit 1
          }

          $stageDir = "dist/release-assets"
          $setupDest = Join-Path $stageDir "NetFlow-Sentinel-$tagName-windows-x64-setup.exe"
          $sumsFile = Join-Path $stageDir "SHA256SUMS.txt"
          $releaseAttestation = Join-Path $stageDir "release_e2e_verification.json"
          $nsisAttestation = Join-Path $stageDir "nsis_e2e_verification.json"
          $setupHash = (python -c "import hashlib, sys; print(hashlib.sha256(open(sys.argv[1], 'rb').read()).hexdigest())" $setupDest).Trim().ToLower()

          if (-not $isPrerelease) {
            if (-not (Test-Path $releaseAttestation)) {
              Write-Error "FAIL-CLOSED: Missing mandatory live release_e2e_verification.json for Stable release $tagName."
              exit 1
            }
            python scripts/verify_companion_artifacts.py --verify-attestation $releaseAttestation `
              --expect-commit "${{ github.sha }}" `
              --expect-installer-sha256 $setupHash `
              --require-nsis-e2e
            if ($LASTEXITCODE -ne 0) {
              Write-Error "FAIL-CLOSED: Stable release attestation verification failed before gh release create."
              exit 1
            }
          }

          $desktopVer = "${{ steps.meta.outputs.desktop_version }}"
          $baseSemVer = ($desktopVer -split '-')[0]
          $exactNotesPath = "docs/releases/v$desktopVer.md"
          $baseNotesPath = "docs/releases/v$baseSemVer.md"
          if (Test-Path $exactNotesPath) {
            $notesPath = $exactNotesPath
          } elseif (Test-Path $baseNotesPath) {
            $notesPath = $baseNotesPath
          } else {
            Write-Error "Release notes file not found: $exactNotesPath or $baseNotesPath"
            exit 1
          }

          $releaseArgs = @(
            "release", "create", $tagName,
            $setupDest,
            $sumsFile
          )
          if (Test-Path $releaseAttestation) {
            $releaseArgs += $releaseAttestation
          } elseif (Test-Path $nsisAttestation) {
            $releaseArgs += $nsisAttestation
          }
          $releaseArgs += @(
            "--verify-tag",
            "--title", "NetFlow Sentinel $tagName — M6 Desktop Demo",
            "--notes-file", $notesPath
          )
          if ($isPrerelease) {
            $releaseArgs += "--prerelease"
          }

          & gh @releaseArgs
          if ($LASTEXITCODE -ne 0) {
            Write-Error "Failed to create GitHub Release for $tagName"
            exit 1
          }
