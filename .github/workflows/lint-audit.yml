name: Lint audit

# Audit of Ruff and Black. It records the repository-wide legacy lint debt
# separately from the files that the current change set owns, so that a migration
# or analysis change can prove that it introduces no new lint findings without
# having to reformat unrelated legacy files.
on:
  workflow_dispatch:
    inputs:
      ref:
        description: "Branch, tag or SHA to audit"
        required: false
        default: feat/v2-integration

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref || github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install pinned lint tools
        run: |
          python -m pip install --upgrade pip
          python -m pip install "ruff==0.17.5" "black==26.10.1"

      - name: Record tool versions
        run: |
          python --version
          ruff --version
          black --version
          git rev-parse HEAD

      - name: Resolve scoped Python files for lint gate
        run: |
          # Core repository files maintained under active quality gates
          declare -a SCOPED_LIST=(
            "scripts/build_v2_dataset_and_split.py"
            "scripts/fetch_multi_source_dataset.py"
            "scripts/profile_multi_source.py"
            "scripts/run_ctu_cross_source_eval.py"
            "scripts/train_autoencoder.py"
            "scripts/train_isolation_forest.py"
            "scripts/train_random_forest.py"
            "scripts/train_xgboost.py"
            "src/network_anomaly/config.py"
            "src/network_anomaly/data/v2_schema.py"
            "src/network_anomaly/data/split.py"
            "src/network_anomaly/eda"
            "src/network_anomaly/models/__init__.py"
            "src/network_anomaly/models/autoencoder.py"
            "src/network_anomaly/models/isolation_forest.py"
            "src/network_anomaly/models/random_forest.py"
            "src/network_anomaly/models/xgboost_model.py"
            "src/network_anomaly/models/xgboost_protocol.py"
            "tests/unit/test_autoencoder.py"
            "tests/unit/test_isolation_forest.py"
            "tests/unit/test_v2_migration_guards.py"
            "tests/unit/test_xgb_baseline_protocol.py"
            "tests/unit/test_xgb_model_structure.py"
            "tests/unit/test_rf_baseline_protocol.py"
            "tests/unit/test_rf_model_structure.py"
            "src/network_anomaly/canonical"
            "src/network_anomaly/crypto"
            "src/network_anomaly/behavioral"
            "src/network_anomaly/risk"
            "src/network_anomaly/trace"
            "src/network_anomaly/telemetry"
            "src/network_anomaly/streaming"
            "src/network_anomaly/ml"
            "src/network_anomaly/pipeline/multi_source.py"
            "src/network_anomaly/data/quality_gate.py"
            "src/network_anomaly/data/taxonomy.py"
            "src/network_anomaly/ingestion/adapters/v2_adapter.py"
            "tests/integration/test_full_system_e2e.py"
            "tests/integration/test_live_telemetry_flow.py"
            "tests/unit/test_telemetry_collector.py"
            "tests/unit/test_streaming_pipeline.py"
            "tests/unit/test_quality_gate.py"
            "tests/unit/test_multi_source_split.py"
            "tests/unit/test_v2_adapters.py"
            "tests/unit/test_ood_and_calibration.py"
            "tests/unit/test_xgboost.py"
          )

          BASE_REF="${{ github.base_ref }}"
          if [ -z "$BASE_REF" ]; then
            BASE_REF="main"
          fi

          CHANGED_PY=""
          if git rev-parse --verify "origin/$BASE_REF" >/dev/null 2>&1; then
            MERGE_BASE=$(git merge-base HEAD "origin/$BASE_REF" 2>/dev/null || true)
            if [ -n "$MERGE_BASE" ]; then
              CHANGED_PY=$(git diff --name-only --diff-filter=d "$MERGE_BASE"...HEAD -- '*.py' 2>/dev/null || true)
            fi
          fi

          for f in "${SCOPED_LIST[@]}" $CHANGED_PY; do
            if [ -e "$f" ]; then
              echo "$f"
            fi
          done | sort -u > scoped_files.txt

          echo "Auditing the following scoped files:"
          cat scoped_files.txt

      - name: Scoped Ruff (files owned by this change set)
        run: |
          xargs -a scoped_files.txt ruff check

      - name: Scoped Black (files owned by this change set)
        run: |
          xargs -a scoped_files.txt black --check

      - name: Repository-wide Ruff (legacy debt, non-gating)
        continue-on-error: true
        run: |
          set +e
          ruff check . --output-format=concise > ruff-repository.txt 2>&1
          echo "ruff_exit=$?" >> ruff-repository.txt
          cat ruff-repository.txt

      - name: Repository-wide Black (legacy debt, non-gating)
        continue-on-error: true
        run: |
          set +e
          black --check . > black-repository.txt 2>&1
          echo "black_exit=$?" >> black-repository.txt
          cat black-repository.txt

      - name: Upload lint findings
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: lint-audit-findings
          path: |
            ruff-repository.txt
            black-repository.txt
