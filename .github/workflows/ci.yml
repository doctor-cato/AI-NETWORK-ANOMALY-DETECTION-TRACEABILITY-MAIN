name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python-version: ['3.11', '3.12']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install dependencies
        run: pip install -e .
      - name: Check environment
        run: python scripts/check_environment.py
      - name: Check syntax
        run: python -m compileall -q src scripts tests
      - name: Check imports (core modules, not just syntax)
        run: |
          python -c "import network_anomaly, network_anomaly.config, network_anomaly.data, network_anomaly.data.nf_unsw_nb15_v3, network_anomaly.evaluation.metrics, network_anomaly.features, network_anomaly.inference.pipeline, network_anomaly.models.isolation_forest, network_anomaly.models.random_forest, network_anomaly.preprocessing, network_anomaly.visualization.plots"
      - name: Unit + integration tests
        run: python -m pytest tests -q --tb=short
      - name: Validate NF-UNSW-NB15-v3 — SKIPPED if raw package is absent
        run: python scripts/validate_data.py
