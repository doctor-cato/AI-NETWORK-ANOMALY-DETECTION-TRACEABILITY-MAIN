name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main, feat/v2-integration]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install quality tools
        run: python -m pip install --prefer-binary "ruff==0.17.5" "black==26.10.1"
      - name: Ruff
        run: python -m ruff check src scripts tests
      - name: Black
        run: python -m black --check src scripts tests

  test:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python-version: ['3.11', '3.12']
    steps:
      - uses: actions/checkout@v4
      - id: setup-py
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: 'pip'
          cache-dependency-path: pyproject.toml
      - name: Cache Python virtualenv
        id: cache-venv
        uses: actions/cache@v4
        with:
          path: .venv
          key: venv-${{ runner.os }}-py${{ steps.setup-py.outputs.python-version }}-${{ hashFiles('pyproject.toml') }}
      - name: Install dependencies into virtualenv
        shell: bash
        run: |
          if [ ! -d ".venv" ]; then
            python -m venv .venv
          fi
          if [ -d ".venv/Scripts" ]; then
            VENV_BIN="$PWD/.venv/Scripts"
          else
            VENV_BIN="$PWD/.venv/bin"
          fi
          if command -v cygpath >/dev/null 2>&1; then
            cygpath -w "$VENV_BIN" >> "$GITHUB_PATH"
          else
            echo "$VENV_BIN" >> "$GITHUB_PATH"
          fi
          if [ "${{ steps.cache-venv.outputs.cache-hit }}" = "true" ]; then
            "$VENV_BIN/python" -m pip install --no-deps --no-build-isolation -e .
            "$VENV_BIN/python" -m pip install "ruff==0.17.5" "black==26.10.1"
          else
            "$VENV_BIN/python" -m pip install --prefer-binary setuptools wheel -e ".[dev]"
          fi
      - name: Check environment
        run: python scripts/check_environment.py
      - name: Check OpenAPI & API contract sync
        if: matrix.os == 'ubuntu-latest' && matrix.python-version == '3.12'
        run: python scripts/export_openapi_spec.py --check
      - name: Verify distribution governance & attribution notices
        if: matrix.os == 'ubuntu-latest' && matrix.python-version == '3.12'
        run: python scripts/verify_companion_artifacts.py --verify-distribution-permission research-only --target-channel local_offline
      - name: Check syntax
        run: python -m compileall -q src scripts tests
      - name: Check imports (core modules, not just syntax)
        run: |
          python -c "import network_anomaly, network_anomaly.config, network_anomaly.data, network_anomaly.data.v2_schema, network_anomaly.data.taxonomy, network_anomaly.data.quality_gate, network_anomaly.data.split, network_anomaly.canonical.event, network_anomaly.canonical.feature_contract, network_anomaly.crypto.aead, network_anomaly.crypto.key_manager, network_anomaly.crypto.rotation, network_anomaly.crypto.encrypted_storage, network_anomaly.behavioral.vector, network_anomaly.behavioral.sessionizer, network_anomaly.behavioral.similarity, network_anomaly.risk.scoring, network_anomaly.risk.aggregation, network_anomaly.trace.graph, network_anomaly.trace.engine, network_anomaly.trace.timeline, network_anomaly.trace.investigation, network_anomaly.telemetry.collector, network_anomaly.telemetry.pcap_reader, network_anomaly.telemetry.log_tailer, network_anomaly.telemetry.modes, network_anomaly.streaming.pipeline, network_anomaly.streaming.feature_extractor, network_anomaly.streaming.realtime_inference, network_anomaly.streaming.alert_manager, network_anomaly.streaming.live_orchestrator, network_anomaly.ml.ood_gate, network_anomaly.ml.threshold_calibration, network_anomaly.pipeline.multi_source, network_anomaly.ingestion.adapters.v2_adapter, network_anomaly.eda, network_anomaly.evaluation.metrics, network_anomaly.features, network_anomaly.inference.pipeline, network_anomaly.ingestion, network_anomaly.models.autoencoder, network_anomaly.models.isolation_forest, network_anomaly.models.random_forest, network_anomaly.models.xgboost_model, network_anomaly.preprocessing"
      - name: Unit + integration tests
        run: python -m pytest tests -q --tb=short
      - name: Verify AIT multi-source dataset manifest & checksums
        if: matrix.os == 'ubuntu-latest' && matrix.python-version == '3.12'
        run: python scripts/fetch_multi_source_dataset.py --verify-only
      - name: Validate live telemetry & authorized lab acceptance
        if: matrix.os == 'ubuntu-latest' && matrix.python-version == '3.12'
        run: python scripts/run_live_lab_acceptance.py
      - name: Verify full system performance benchmark
        if: matrix.os == 'ubuntu-latest' && matrix.python-version == '3.12'
        run: python scripts/benchmark_full_system.py

  desktop-frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: desktop/package-lock.json
      - name: Install frontend dependencies
        run: npm --prefix desktop ci
      - name: Svelte & TypeScript typecheck
        run: npm --prefix desktop run check
      - name: Frontend unit tests
        run: npm --prefix desktop test
      - name: Vite production build
        run: npm --prefix desktop run build

  desktop-tauri-windows:
    runs-on: windows-latest
    env:
      CARGO_INCREMENTAL: "0"
      CARGO_PROFILE_DEV_DEBUG: "0"
      CARGO_PROFILE_TEST_DEBUG: "0"
      CARGO_TERM_COLOR: "always"
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - name: Rust formatting check
        run: cargo fmt --manifest-path desktop/src-tauri/Cargo.toml --check
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'
          cache-dependency-path: requirements-runtime.txt
      - name: Install Python backend dependencies
        run: |
          pip install --prefer-binary -r requirements-runtime.txt
          pip install --no-deps -e .
      - name: Verify desktop version consistency
        run: python scripts/check_desktop_version.py --check
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: desktop/package-lock.json
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: "desktop/src-tauri -> target"
          cache-on-failure: true
      - name: Build Svelte frontend assets for Tauri embed
        run: |
          npm --prefix desktop ci
          npm --prefix desktop run build
      - name: Rust clippy lint
        run: cargo clippy --manifest-path desktop/src-tauri/Cargo.toml --all-targets -- -D warnings
      - name: Rust desktop unit tests
        env:
          NETWORK_ANOMALY_REQUIRE_PYTHON_TEST: "1"
        run: cargo test --manifest-path desktop/src-tauri/Cargo.toml --lib
      - name: Build Windows desktop executable
        run: cargo build --manifest-path desktop/src-tauri/Cargo.toml --bins
