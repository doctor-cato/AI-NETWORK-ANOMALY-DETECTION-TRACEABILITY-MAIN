name: Feature request
about: Propose a new feature or enhancement (do not use for core mandatory work blocking)
body:
  - type: form
    fields:
      - id: description
        label: What would you like to add?
        type: textarea
      - id: scope
        label: Is this in mandatory scope (M0–M5) or future work?
        type: dropdown
        options:
          - Mandatory scope
          - Future work / enhancement
      - id: deliverables
        label: Expected deliverables / files
        type: textarea
