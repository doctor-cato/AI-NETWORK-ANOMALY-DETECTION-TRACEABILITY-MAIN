name: Bug report
about: Report a problem with code, data handling, or documentation
body:
  - type: form
    fields:
      - id: description
        label: What is the problem?
        type: textarea
      - id: steps
        label: Steps to reproduce
        type: textarea
      - id: expected
        label: Expected behavior
        type: textarea
      - id: environment
        label: Environment (Python version, OS)
        type: input
      - id: dataset_status
        label: Dataset status (downloaded / not downloaded / fixture used)
        type: input
