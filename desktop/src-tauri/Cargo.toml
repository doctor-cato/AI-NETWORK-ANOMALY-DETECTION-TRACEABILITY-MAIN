[package]
name = "netflow-sentinel-desktop"
version = "1.0.0"
description = "Offline Desktop Application for AI Network Anomaly Detection (UNSW-NB15-v3 / M6)"
authors = ["Network Anomaly Detection Project"]
edition = "2021"

[lib]
name = "netflow_sentinel_desktop_lib"
crate-type = ["rlib"]

[features]
default = ["custom-protocol"]
custom-protocol = ["tauri/custom-protocol"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
reqwest = { version = "0.12", default-features = false, features = ["json", "blocking"] }
tokio = { version = "1", features = ["time", "macros", "rt-multi-thread"] }
getrandom = "0.4"
